name: CodeQL

on:
  push:
    branches: [main]
  # No branch filter: scan every PR, including sub-PRs onto integration branches
  # (e.g. feat/qt-editor), so a new integration branch needs no workflow change.
  pull_request:
  schedule:
    # Weekly, offset from CI so the two don't contend for runners.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the CodeQL results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # JS/TS needs no build configuration.
          - language: javascript-typescript
          # C/C++ scanned build-free (GA Oct 2025): CodeQL extracts from the
          # source without driving the CMake/Qt build.
          - language: c-cpp
            build-mode: none
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
